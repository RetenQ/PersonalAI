[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personalai-local"
version = "0.3.0"
description = "Local-first personal records with explicit approval workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "portalocker>=3,<4", "tzdata>=2024.1", "httpx>=0.27,<1",
  "pywin32>=306; sys_platform == 'win32'"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

